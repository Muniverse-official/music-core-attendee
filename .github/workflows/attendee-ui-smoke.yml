name: Admin UI smoke tests
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'programs/finger-king/**'
      - 'site/**'
      - 'tools/*smoke.mjs'
      - 'tools/qa-enhypen-admin-ui.mjs'
      - '.github/workflows/attendee-ui-smoke.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/attendee-ui-smoke.yml'
      - 'tools/admin-ui-smoke.mjs'
      - 'tools/admin-scoped-ui-smoke.mjs'
      - 'tools/reserve-ui-smoke.mjs'
      - 'tools/finger-admin-ui-smoke.mjs'
      - 'tools/qa-enhypen-admin-ui.mjs'
      - 'programs/finger-king/**'
      - 'site/**'
      - 'site/admin/**'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned browser test dependency
        run: npm install --no-save --package-lock=false playwright@1.55.0
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Check admin login and latest-round UI
        run: node tools/admin-ui-smoke.mjs
      - name: Check scoped admin loading and paging
        run: node tools/admin-scoped-ui-smoke.mjs
      - name: Check ENHYPEN announcement schedule and visibility UI
        run: node tools/qa-enhypen-admin-ui.mjs
      - name: Build Finger King for the integrated console test
        run: |
          npm ci --prefix programs/finger-king
          npm run build --prefix programs/finger-king
      - name: Check reserve result and separate administrator lists
        run: node tools/reserve-ui-smoke.mjs
      - name: Check simplified Finger King administration and privacy deletion
        run: node tools/finger-admin-ui-smoke.mjs
      - name: Save screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-ui-screenshot
          path: qa-screenshots
          retention-days: 3
