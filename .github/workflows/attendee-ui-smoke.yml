name: Attendee UI smoke tests
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/attendee-ui-smoke.yml'
      - 'tools/attendee-ui-smoke.mjs'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned browser test dependency
        run: npm install --no-save --package-lock=false playwright@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Check deployed pages
        run: node tools/attendee-ui-smoke.mjs
      - name: Save screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: attendee-ui-screenshots
          path: qa-screenshots
          retention-days: 3
