name: Deploy Music Core attendee site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Use Node 24 for regression checks
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check out FANS PICK client for shared regressions
        uses: actions/checkout@v6
        with:
          repository: Muniverse-official/cover-pick-attendee
          path: qa-peer-fans
          persist-credentials: false
      - name: Check registration and delivery regressions before publishing
        env:
          FANS_PICK_SOURCE: ${{ github.workspace }}/qa-peer-fans/app.js
        run: |
          node tools/qa-edge.mjs
          node tools/qa-reserve-edge.mjs
          node tools/qa-remediation.mjs
          node tools/qa-worker.mjs
      - name: Build Finger King and publish the ENHYPEN entry point
        run: |
          npm ci --prefix programs/finger-king
          npm run build --prefix programs/finger-king
          cp -R site/private-test site/enhypen
      - name: Verify the live program endpoints
        run: |
          curl -fsS --retry 2 "https://kkaoerbblpuszptiibvo.supabase.co/functions/v1/finger-king?action=status" | node -e "let s='';process.stdin.on('data',x=>s+=x);process.stdin.on('end',()=>{if(!Array.isArray(JSON.parse(s).groups))process.exitCode=1})"
          curl -fsS --retry 2 -H "Origin: https://muniverse-official.github.io" -H "Content-Type: application/json" -H "X-Admin-Request: 1" --data '{"action":"preview"}' "https://kkaoerbblpuszptiibvo.supabase.co/functions/v1/attendee-private-test" | node -e "let s='';process.stdin.on('data',x=>s+=x);process.stdin.on('end',()=>{if(JSON.parse(s).ok!==true)process.exitCode=1})"
      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
