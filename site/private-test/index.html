<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src data:; connect-src https://kkaoerbblpuszptiibvo.supabase.co; form-action 'none'; base-uri 'none'; object-src 'none'">
  <title>ENHYPEN’S SPECIAL SHOW | 방청 당첨 확인</title>
  <link rel="stylesheet" href="style.css?v=5">
  <script src="copy.js?v=5" defer></script>
  <script src="consent.js?v=5" defer></script>
  <script src="verify.js?v=5" defer></script>
</head>
<body>
  <main>
    <div class="art" id="art" hidden>
      <img class="art-backdrop" id="backdrop" width="1000" height="1000" alt="" aria-hidden="true">
      <img class="art-poster" id="banner" width="1000" height="1000" alt="MBC ENHYPEN’S SPECIAL SHOW">
    </div>
    <section class="panel">
      <div class="content">
      <header><select id="lang" aria-label="Language / 언어"><option value="ko">한국어</option><option value="en">English</option><option value="ja">日本語</option><option value="zh-TW">繁體中文</option><option value="zh-CN">简体中文</option></select></header>
      <h1 id="title" data-copy="title"></h1>
      <p id="gate" role="status"></p>
      <form id="lookup" autocomplete="off" hidden>
        <p class="lookup-notice" data-copy="lookupNotice"></p>
        <label><span data-copy="email"></span><input id="email" type="email" autocomplete="off" maxlength="254" required></label>
        <label><span data-copy="nickname"></span><input id="nickname" autocomplete="off" maxlength="80" required></label>
        <button id="submit" data-copy="verify"></button>
      </form>
      <div id="outcome" aria-live="polite"><p id="result"></p><div id="number-card" hidden><span data-copy="number"></span><strong id="number"></strong></div></div>
      <section id="winner-section" aria-labelledby="winner-heading" hidden>
        <h2 id="winner-heading" data-copy="winnerHeading"></h2><p id="winner-status" role="status"></p><p id="deadline"></p>
        <form id="consent-form" autocomplete="off">
          <label><span data-copy="legalName"></span><input id="legal-name" maxlength="100" autocomplete="name" required></label>
          <label><span data-copy="phone"></span><input id="phone" type="tel" maxlength="40" autocomplete="tel" required></label>
          <div class="privacy"><h3 data-copy="privacy"></h3><p data-copy="collection"></p><label class="check"><input id="collect-consent" type="checkbox" required><span data-copy="collectAgree"></span></label></div>
          <div class="privacy"><h3 data-copy="thirdTitle"></h3><p data-copy="third"></p><p id="japan-safeguards" hidden><a href="https://www.ppc.go.jp/enforcement/infoprovision/laws/offshore_report_korea/">韓国の個人情報保護制度</a> · <a href="https://privacy.weverse.io/union/easy_policies/easy_privacy_policy_en.html">提供先のプライバシーポリシー</a></p><p data-copy="rights"></p><a href="mailto:support@muniverse.io">support@muniverse.io</a></div>
          <button id="agree" type="submit" data-copy="agree"></button>
        </form>
        <div class="privacy" id="attendance-info"><h3 data-copy="attendanceTitle"></h3><ul id="attendance-list"></ul></div>
      </section>
      </div>
    </section>
  </main>
</body>
</html>
