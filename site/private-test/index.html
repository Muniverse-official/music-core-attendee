<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src data:; connect-src https://kkaoerbblpuszptiibvo.supabase.co; form-action 'none'; base-uri 'none'; object-src 'none'">
  <title>ENHYPEN’S SPECIAL SHOW | 방청 당첨 확인</title>
  <link rel="stylesheet" href="style.css?v=4">
  <script src="copy.js?v=3" defer></script>
  <script src="verify.js?v=4" defer></script>
</head>
<body>
  <main>
    <div class="art" id="art" hidden>
      <img class="art-backdrop" id="backdrop" width="1000" height="1000" alt="" aria-hidden="true">
      <img class="art-poster" id="banner" width="1000" height="1000" alt="MBC ENHYPEN’S SPECIAL SHOW">
    </div>
    <section class="panel">
      <div class="content">
      <header><select id="lang" aria-label="Language / 언어"><option value="ko">한국어</option><option value="en">English</option><option value="ja">日本語</option><option value="zh-TW">繁體中文</option><option value="zh-CN">简体中文</option></select></header>
      <h1 id="title" data-copy="title"></h1>
      <p id="gate" role="status"></p>
      <form id="lookup" autocomplete="off" hidden>
        <label><span data-copy="email"></span><input id="email" type="email" autocomplete="off" maxlength="254" required></label>
        <label><span data-copy="nickname"></span><input id="nickname" autocomplete="off" maxlength="80" required></label>
        <button id="submit" data-copy="verify"></button>
        <div id="outcome" aria-live="polite"><p id="result"></p><div id="number-card" hidden><span data-copy="number"></span><strong id="number"></strong></div></div>
        <details><summary data-copy="privacy"></summary><p data-copy="collection"></p><h2 data-copy="thirdTitle"></h2><p data-copy="third"></p><p data-copy="pending"></p></details>
      </form>
      </div>
    </section>
  </main>
</body>
</html>
