<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src data:; connect-src https://kkaoerbblpuszptiibvo.supabase.co; form-action 'none'; base-uri 'none'; object-src 'none'">
  <title>Muniverse | Private Test</title>
  <link rel="stylesheet" href="style.css">
  <script src="copy.js" defer></script>
  <script src="verify.js" defer></script>
</head>
<body>
  <main>
    <header><strong>muniverse<span>.</span></strong><select id="lang" aria-label="Language / 언어"><option value="ko">한국어</option><option value="en">English</option><option value="ja">日本語</option><option value="zh-TW">繁體中文</option><option value="zh-CN">简体中文</option></select></header>
    <img id="banner" width="1280" height="720" alt="ENHYPEN’S SPECIAL SHOW" hidden>
    <section>
      <h1 id="title" data-copy="title"></h1>
      <p id="gate" role="status"></p>
      <a href="https://muniverse-official.github.io/music-core-attendee/admin/#private-test" id="admin" data-copy="admin" hidden></a>
      <form id="lookup" autocomplete="off" hidden>
        <p class="test" data-copy="test"></p>
        <label><span data-copy="email"></span><input id="email" type="email" placeholder="enhypen-test@example.invalid" autocomplete="off" maxlength="254" required></label>
        <label><span data-copy="nickname"></span><input id="nickname" placeholder="ENGENE TEST" autocomplete="off" maxlength="80" required></label>
        <button id="submit" data-copy="verify"></button>
        <p id="result" role="status"></p>
        <details><summary data-copy="privacy"></summary><p data-copy="collection"></p><h2 data-copy="thirdTitle"></h2><p data-copy="third"></p><p data-copy="pending"></p></details>
      </form>
    </section>
  </main>
</body>
</html>
